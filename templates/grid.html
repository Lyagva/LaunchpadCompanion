<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Launchpad Grid - Page {{ page }}</title>
  <link rel="icon" href="{{ url_for('static', filename='icon256.ico') }}" type="image/x-icon">
  <link rel="stylesheet" href="{{ url_for('static', filename='companion.css') }}">
  <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
  <style>
    body {
      background: var(--color-bg-dark);
      color: var(--color-text-white);
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(9, 1fr);
      gap: 4px;
      max-width: 600px;
      margin: 0 auto;
    }

    .grid-button {
      aspect-ratio: 1;
      border-radius: var(--radius-md);
      transition: background-color 0.1s ease;
      border: 1px solid rgba(255, 255, 255, 0.1);
      position: relative;
    }

    .grid-button::after {
      content: attr(data-pos);
      position: absolute;
      bottom: 2px;
      right: 4px;
      font-size: 8px;
      color: rgba(255, 255, 255, 0.4);
      text-shadow: 0 0 2px rgba(0, 0, 0, 0.8);
    }

    .card {
      background: var(--color-bg-dark-card);
    }
  </style>
</head>
<body class="dark">
  <div class="container-narrow">
    <div class="flex-between mb-lg">
      <h1>Launchpad Grid Visualizer</h1>
      <a href="{{ url_for('index') }}" class="btn btn-primary">Settings</a>
    </div>

    <div class="card">
      <div class="card-header">
        <div class="status-indicator status-checking" id="status-indicator">
          <span id="status-text">Connecting...</span>
        </div>
        <div class="text-sm text-secondary">
          Page: <span class="text-white" style="font-weight: 600;">{{ page }}</span>
        </div>
      </div>

      <div class="grid-container" id="grid"></div>

      <div class="text-xs text-center text-secondary mt-md">
        Colors update in real-time from Bitfocus Companion
      </div>
    </div>
  </div>

  <script>
    const page = {{ page }};
    const socket = io();
    const statusIndicator = document.getElementById('status-indicator');
    const statusText = document.getElementById('status-text');
    const grid = document.getElementById('grid');
    let reconnectAttempts = 0;
    const maxReconnectAttempts = 5;

    // Create 9x9 grid
    for (let row = 0; row < 9; row++) {
      for (let col = 0; col < 9; col++) {
        const button = document.createElement('div');
        button.className = 'grid-button';
        button.id = `btn-${row}-${col}`;
        button.dataset.pos = `${row},${col}`;
        button.style.backgroundColor = 'rgb(0, 0, 0)';
        grid.appendChild(button);
      }
    }

    function setButtonColor(row, col, r, g, b) {
      const btn = document.getElementById(`btn-${row}-${col}`);
      if (btn) {
        btn.style.backgroundColor = `rgb(${r}, ${g}, ${b})`;
      }
    }

    socket.on('connect', () => {
      console.log('WebSocket connected');
      reconnectAttempts = 0;
      statusIndicator.className = 'status-indicator status-connected';
      statusText.textContent = 'Connected';
      socket.emit('request_grid', { page: page });
    });

    socket.on('disconnect', () => {
      console.log('WebSocket disconnected');
      statusIndicator.className = 'status-indicator status-disconnected';
      statusText.textContent = 'Disconnected';
    });

    socket.on('connect_error', (error) => {
      console.error('Connection error:', error);
      reconnectAttempts++;
      statusIndicator.className = 'status-indicator status-disconnected';
      if (reconnectAttempts >= maxReconnectAttempts) {
        statusText.textContent = 'Connection failed - please refresh';
      } else {
        statusText.textContent = `Connection error (attempt ${reconnectAttempts}/${maxReconnectAttempts})`;
      }
    });

    socket.on('grid_state', (data) => {
      console.log('Received grid state:', data);
      if (data.page === page) {
        for (const [key, color] of Object.entries(data.buttons)) {
          const [row, col] = key.split('/').map(Number);
          setButtonColor(row, col, color[0], color[1], color[2]);
        }
      }
    });

    socket.on('button_update', (data) => {
      if (data.page === page) {
        setButtonColor(data.row, data.col, data.color.r, data.color.g, data.color.b);
      }
    });
  </script>
</body>
</html>
